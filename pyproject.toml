[project]
name = "another-cuhk-course-planner"
version = "0.1.0"
description = "Interactive CUHK timetable planner with automatic conflict detection & easy resolution, fast course search, .ics export, and screenshot features."
authors = [{ name = "EZ" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
# No upper caps: uv.lock is the pin and CI is the gate. See docs/decisions.md.
dependencies = [
    "beautifulsoup4>=4.14.2",
    "markdownify>=1.2.0",
    "ddddocr>=1.5.6",
    "requests>=2.33.0",
    "tzdata>=2025.2",
    "pyperclip>=1.11.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored and archived paths; the other .prettierignore entries hold no Python or Markdown.
extend-exclude = ["lab", "docs/archived", ".agents", ".claude"]

[tool.ruff.lint]
# Pinned rather than extend-select: ruff widens its defaults between releases, and 0.16 added ~180 findings here. E4/E7/E9/F were the old defaults; "I" is ruff's isort; "UP" holds annotations and stdlib calls at the target-version syntax.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.pytest.ini_options]
# scripts/ modules import each other by bare name (they run with scripts/ on the
# path), so add it here too. Tests live next to the code under scripts/tests/.
pythonpath = ["scripts"]
testpaths = ["scripts/tests"]
