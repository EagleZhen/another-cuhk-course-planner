[project]
name = "another-cuhk-course-planner"
version = "0.1.0"
description = "Interactive CUHK timetable planner with automatic conflict detection & easy resolution, fast course search, .ics export, and screenshot features."
authors = [{ name = "EZ" }]
requires-python = ">=3.10, <3.13"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "beautifulsoup4 (>=4.14.2,<5.0.0)",
    "markdownify (>=1.2.0,<2.0.0)",
    "ddddocr (>=1.5.6,<2.0.0)",
    "requests>=2.33.0,<3.0.0",
    "tzdata (>=2025.2,<2026.0)",
    "pyperclip>=1.11.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff (>=0.14.4,<0.15.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# "I" is ruff's isort; its defaults already match the black profile isort used.
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.pytest.ini_options]
# scripts/ modules import each other by bare name (they run with scripts/ on the
# path), so add it here too. Tests live next to the code under scripts/tests/.
pythonpath = ["scripts"]
testpaths = ["scripts/tests"]
