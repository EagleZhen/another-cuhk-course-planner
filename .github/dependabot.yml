# Version-update PRs. Security updates run separately from repo settings.
# Minor/patch updates grouped per ecosystem/directory; majors come separately for a closer look.
# Web updates run Friday evenings; other groups run on the first of each month, all at 18:00 HKT.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: friday
      time: '18:00'
      timezone: Asia/Hong_Kong
    labels:
      - dependencies
    # ESLint v10 crashes eslint-config-next's bundled plugins; see docs/decisions.md.
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm # root tooling (Prettier)
    directory: /
    schedule:
      interval: monthly
      time: '18:00'
      timezone: Asia/Hong_Kong
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions # workflow `uses:` pins
    directory: /
    schedule:
      interval: monthly
      time: '18:00'
      timezone: Asia/Hong_Kong
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv # scraper and Python tooling
    directory: /
    schedule:
      interval: monthly
      time: '18:00'
      timezone: Asia/Hong_Kong
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
