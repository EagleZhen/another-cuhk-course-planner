# Runs the checks pre-commit does not: pytest, vitest, typecheck, and lint.
# Two ecosystems, so two independent jobs — a Python failure should not hide a web one.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - id: install
        run: npm ci

      # Separate steps so the log names which check failed, and each one runs even
      # after an earlier failure so a single run reports every problem. Skipped if
      # the install itself failed, where all three would just fail on a missing binary.
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No bare major tag is published for this action, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # cuhk_scraper imports ddddocr/onnxruntime at module load, so the test
          # run pulls the full dependency set — worth caching.
          cache-dependency-glob: uv.lock

      # Matches the version the lockfile and local venv resolve to.
      - run: uv python install 3.12

      - run: uv sync --locked

      - run: uv run pytest
