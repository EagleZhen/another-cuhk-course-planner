repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
        files: '^scripts/.*\.py$'
      - id: ruff-format
        files: '^scripts/.*\.py$'

  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        files: '^scripts/.*\.py$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        files: '\.json$'
        exclude: '^(data/|web/public/data/|tests/)'
      - id: check-merge-conflict
      - id: check-yaml
      - id: trailing-whitespace
        files: &source_text_files '(^\.editorconfig$|\.(py|js|jsx|ts|tsx|mjs|md|json|ya?ml)$)'
        exclude: '^(data/|web/public/data/|docs/archived/|tests/)'
      - id: end-of-file-fixer
        files: *source_text_files
        exclude: '^(data/|web/public/data/|docs/archived/|tests/)'
