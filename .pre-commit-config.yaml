repos:
  # Ruff and Prettier run from the project's lockfiles, so pre-commit, CI, and the editor share one version.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        files: '^scripts/.*\.py$'
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        files: '^scripts/.*\.py$'
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write
        language: system
        files: '\.(js|jsx|ts|tsx|mjs|md|json|ya?ml|css)$'
        exclude: '^(data/|web/public/data/|web/src/lib/generated/|docs/archived/|lab/)'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        files: '\.json$'
        exclude: '^(data/|web/public/data/|lab/)'
      - id: check-merge-conflict
      - id: check-yaml
      - id: trailing-whitespace
        files: &source_text_files '(^\.editorconfig$|\.(py|js|jsx|ts|tsx|mjs|md|json|ya?ml|css)$)'
        exclude: '^(data/|web/public/data/|docs/archived/|lab/)'
      - id: end-of-file-fixer
        files: *source_text_files
        exclude: '^(data/|web/public/data/|docs/archived/|lab/)'
